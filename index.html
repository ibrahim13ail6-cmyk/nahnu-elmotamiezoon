<style>
:root{--bg:#f3f7f4;--card:#fff;--ink:#14231b;--mut:#5b6b62;--pri:#1b7f5c;--pri2:#0f5a41;--line:#d5e2d9;--ac:#c2410c;--ok:#15803d;--bad:#b91c1c;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1814;--card:#16251e;--ink:#e8f1ec;--mut:#9fb3a8;--pri:#34b283;--pri2:#1b7f5c;--line:#26382f;--ac:#fb923c;--ok:#4ade80;--bad:#f87171;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0e1814;--card:#16251e;--ink:#e8f1ec;--mut:#9fb3a8;--pri:#34b283;--pri2:#1b7f5c;--line:#26382f;--ac:#fb923c;--ok:#4ade80;--bad:#f87171;color-scheme:dark}
*{box-sizing:border-box}
html{height:100%}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:"Segoe UI",Tahoma,Arial,sans-serif;display:flex;flex-direction:column;line-height:1.7}
header{background:linear-gradient(135deg,var(--pri2),var(--pri));color:#fff;text-align:center;padding:20px 16px 16px;border-radius:0 0 24px 24px}
header h1{margin:0;font-size:22px}header p{margin:2px 0 0;opacity:.9;font-size:14px}
main{flex:1;width:100%;max-width:560px;margin:0 auto;padding:18px 16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px}
h2{margin:0 0 8px;font-size:19px;color:var(--pri)}
.welcome{font-size:18px;font-weight:bold;color:var(--ac);margin:0 0 12px}
input[type=text]{width:100%;padding:13px;font-size:16px;border:2px solid var(--line);border-radius:12px;background:var(--bg);color:var(--ink);font-family:inherit;margin:8px 0 14px}
button{font-family:inherit;cursor:pointer;color:var(--ink)}
.btn{width:100%;padding:13px;font-size:16px;font-weight:bold;border:none;border-radius:12px;background:var(--pri);color:#fff;margin-top:8px}
.btn.alt{background:var(--card);color:var(--pri);border:2px solid var(--pri)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}
.sub{padding:16px 8px;border:1px solid var(--line);border-radius:16px;background:var(--card);font-size:16px;font-weight:bold;display:flex;flex-direction:column;align-items:center;gap:4px}
.sub span{font-size:26px}
.list{display:flex;flex-direction:column;gap:10px;margin-top:12px}
.opt{padding:15px;border:1px solid var(--line);border-radius:14px;background:var(--card);font-size:17px;font-weight:bold;text-align:right;display:flex;align-items:center;gap:10px}
.opt small{font-weight:normal;color:var(--mut);margin-right:auto;font-size:13px}
.back{background:none;border:none;color:var(--pri);font-size:15px;font-weight:bold;padding:2px 0 8px}
.empty{margin-top:12px;padding:16px;border:2px dashed var(--line);border-radius:14px;color:var(--mut);text-align:center}
.q{border:1px solid var(--line);border-radius:14px;padding:12px;margin-top:12px}
.q b{display:block;margin-bottom:6px}
.q label{display:block;padding:8px 10px;border:1px solid var(--line);border-radius:10px;margin-top:6px;cursor:pointer}
.q label.ok{border-color:var(--ok);background:rgba(34,197,94,.12)}
.q label.bad{border-color:var(--bad);background:rgba(239,68,68,.12)}
.score{font-size:26px;font-weight:bold;color:var(--pri);text-align:center;margin:8px 0}
.msg{margin-top:10px;font-size:14px;color:var(--mut);text-align:center}
footer{text-align:center;padding:14px 12px calc(14px + env(safe-area-inset-bottom,0px));color:var(--mut);font-size:14px;border-top:1px solid var(--line)}
footer b{color:var(--ink)}

@keyframes pop{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.card{animation:pop .35s ease}
button,.bk2,a.opt{transition:transform .15s,box-shadow .15s,background .2s}
button:active,.bk2:active{transform:scale(.94)}
.opt:hover,.sub:hover,.bk2:hover{transform:translateY(-2px);box-shadow:0 5px 12px rgba(0,0,0,.12)}
.list>*,.grid>*{animation:pop .4s both}
.list>*:nth-child(2),.grid>*:nth-child(2){animation-delay:.05s}.list>*:nth-child(3),.grid>*:nth-child(3){animation-delay:.1s}
.list>*:nth-child(4),.grid>*:nth-child(4){animation-delay:.15s}.list>*:nth-child(5),.grid>*:nth-child(5){animation-delay:.2s}
.list>*:nth-child(n+6),.grid>*:nth-child(n+6){animation-delay:.25s}
.bk2{padding:15px;border:2px solid var(--ac);border-radius:14px;background:var(--card);font-size:17px;font-weight:bold;text-align:right;display:flex;align-items:center;gap:10px;width:100%;margin-top:12px}
a.opt{text-decoration:none;color:var(--ink)}
.back{background:var(--pri)!important;color:#fff!important;padding:9px 20px!important;border-radius:999px;font-size:16px!important;margin-bottom:12px!important;box-shadow:0 3px 8px rgba(0,0,0,.22)}
.bar{position:sticky;top:0;z-index:5;background:var(--card);display:flex;gap:6px;flex-wrap:wrap;padding:8px 0;border-bottom:1px solid var(--line);margin-bottom:6px}
.tb{padding:8px 11px;border:1px solid var(--line);border-radius:10px;background:var(--bg);font-size:14px;font-weight:bold}
.tb.on{background:var(--pri);color:#fff}
.part{position:relative;overflow:hidden;margin-top:8px;border:1px solid var(--line);border-radius:8px}
.part img{position:absolute;left:0;top:0;width:100%}
.part canvas{position:absolute;left:0;top:0;width:100%;height:100%}
body.read header,body.read footer{display:none}

select,input[type=time],input[type=number]{width:100%;padding:11px;font-size:16px;border:2px solid var(--line);border-radius:12px;background:var(--bg);color:var(--ink);font-family:inherit;margin:6px 0}
.two{display:flex;gap:8px;align-items:center}.two>*{flex:1}
.row{display:flex;align-items:center;gap:8px;padding:10px;border:1px solid var(--line);border-radius:12px;margin-top:8px;animation:pop .3s both}
.row span{flex:1}.row button{border:none;background:none;font-size:18px}
.bd{display:inline-block;padding:6px 12px;margin:4px;border-radius:999px;background:var(--bg);border:1px solid var(--line);font-size:14px}
.bd.on{background:var(--pri);color:#fff;border-color:var(--pri)}
.pre.on{background:var(--pri);color:#fff}
select,input[type=time],input[type=number]{width:100%;padding:11px;font-size:16px;border:2px solid var(--line);border-radius:12px;background:var(--bg);color:var(--ink);font-family:inherit;margin:4px 0 10px}
label{font-weight:bold;font-size:14px}.rw{display:flex;gap:8px}.rw>div{flex:1}
.it{display:flex;justify-content:space-between;align-items:center;padding:8px 10px;border:1px solid var(--line);border-radius:10px;margin-top:6px;font-size:14px}
.it button{border:none;background:none;font-size:18px}
.gal{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}.gal .t{animation:pop .4s both}.gal .t.big{grid-column:1/-1}
.t .part{margin-top:0;cursor:zoom-in}.t .cp{display:flex;justify-content:space-between;align-items:center;font-size:13px;margin-top:4px;color:var(--mut)}
.t .cp button{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:5px 9px;font-size:13px;font-weight:bold}
.fc{min-height:170px;display:flex;align-items:center;justify-content:center;text-align:center;padding:18px;border:2px solid var(--pri);border-radius:18px;font-size:19px;font-weight:bold;cursor:pointer;margin:12px 0;animation:flip .35s ease}
.fc.back{background:var(--pri)!important;color:#fff!important;border-radius:18px;box-shadow:none;padding:18px!important;margin:12px 0!important;font-size:19px!important}
@keyframes flip{from{transform:rotateY(80deg);opacity:.3}to{transform:none;opacity:1}}
.row{display:flex;gap:8px}.row>button{flex:1}
.q label.sel{border-color:var(--pri);background:rgba(27,127,92,.14);font-weight:bold}
.nv{position:sticky;bottom:0;background:var(--card);border-top:1px solid var(--line);padding:8px 0;display:flex;flex-wrap:wrap;gap:6px;margin-top:12px;max-height:132px;overflow:auto;z-index:4}
.nb{width:38px;height:38px;border-radius:10px;border:2px solid var(--line);background:var(--bg);font-weight:bold;font-size:14px;padding:0}
.nb.an{background:var(--pri);color:#fff;border-color:var(--pri)}.nb.fg{background:#f59e0b;color:#000;border-color:#f59e0b}.nb.cur{outline:3px solid var(--ac);outline-offset:1px}
button:disabled{opacity:.45}
@media print{header,footer,.back,.bar,.btn,.nv,.tb,.bk2,.no-print{display:none!important}body{background:#fff}.card{border:none;box-shadow:none;animation:none}.q{page-break-inside:avoid}}
.pr-only{display:none}@media print{.pr-only{display:block}}
input[type=email],input[type=password]{width:100%;padding:13px;font-size:16px;border:2px solid var(--line);border-radius:12px;background:var(--bg);color:var(--ink);font-family:inherit;margin:6px 0 12px}
.toast{position:fixed;bottom:76px;left:12px;right:12px;background:#111827;color:#fff;padding:10px 14px;border-radius:12px;font-size:14px;z-index:99;text-align:center;animation:pop .3s}
.logo{width:88px;height:88px;display:block;margin:0 auto 4px;filter:drop-shadow(0 4px 10px rgba(0,0,0,.28));animation:lpop .8s cubic-bezier(.2,1.4,.4,1) both}
.logo .ring{transform-box:fill-box;transform-origin:center;animation:spin 14s linear infinite}
.logo .lf{transform-box:fill-box;transform-origin:center bottom;animation:sway 3.2s ease-in-out infinite}.logo .l2{animation-delay:.5s}
.logo .stem{stroke-dasharray:30;animation:grow 1.6s ease-out both}
.logo .st{transform-box:fill-box;transform-origin:center;animation:tw 2.2s ease-in-out infinite}
@keyframes lpop{from{transform:scale(.3) rotate(-30deg);opacity:0}to{transform:none;opacity:1}}
@keyframes spin{to{transform:rotate(360deg)}}@keyframes sway{0%,100%{transform:rotate(-7deg)}50%{transform:rotate(7deg)}}
@keyframes grow{from{stroke-dashoffset:30}to{stroke-dashoffset:0}}@keyframes tw{0%,100%{opacity:.25;transform:scale(.6)}50%{opacity:1;transform:scale(1.1)}}
header p.shine{opacity:1;font-size:20px;font-weight:bold;background:linear-gradient(90deg,#fff 20%,#ffe08a 50%,#fff 80%);background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 3.2s linear infinite}
@keyframes shine{from{background-position:200% 0}to{background-position:-200% 0}}
@media (prefers-reduced-motion:reduce){.logo,.logo *,header p.shine{animation:none!important}}

<script>
// زرار سريع يفتح لك صفحة الإنجازات ولوحة الشرف والـ PDF بضغطة واحدة
window.addEventListener('DOMContentLoaded', () => {
  const btn = document.createElement('button');
  btn.innerHTML = "🏆 إنجازاتي لوحة الشرف & PDF";
  btn.style.cssText = "position:fixed; bottom:20px; left:20px; z-index:9999; background:#1b7f5c; color:#fff; padding:12px 18px; border:none; border-radius:30px; font-weight:bold; cursor:pointer; box-shadow:0 4px 10px rgba(0,0,0,0.3);";
  btn.onclick = () => {
    const pts = 120; // النقاط
    const mins = 150; // دقائق المذاكرة
    const win = window.open('', '_blank');
    win.document.write(`
      <html dir="rtl">
      <head>
        <title>إنجازاتي ولوحة الشرف</title>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"><\/script>
        <style>body{font-family:Tahoma; padding:20px; background:#f3f7f4; color:#14231b;}</style>
      </head>
      <body>
        <div id="pdf" style="background:#fff; padding:20px; border-radius:12px;">
          <h2>🏆 لوحة الشرف وإنجازات الطالب: إبراهيم علي</h2>
          <p>إجمالي النقاط: <b>${pts} نقطة</b></p>
          <p>دقائق المذاكرة: <b>${mins} دقيقة</b></p>
          <hr>
          <h3>أوائل الطلاب:</h3>
          <p>1. إبراهيم علي - ${pts} نقطة 🥇</p>
        </div>
        <br>
        <button onclick="html2pdf().from(document.getElementById('pdf')).save('taqrir.pdf')" style="padding:10px 20px; background:#1b7f5c; color:#fff; border:none; border-radius:8px; cursor:pointer;">⬇️ تحميل التقرير PDF</button>
      </body>
      </html>
    `);
  };
  document.body.appendChild(btn);
});
</script>

/* كاتب PDF بسيط من صور JPEG */
function pdfFrom(pgs){
 const enc=new TextEncoder(),ch=[],off=[];let len=0;
 const add=x=>{const u=typeof x==="string"?enc.encode(x):x;ch.push(u);len+=u.length};
 const obj=(n,body)=>{off[n]=len;add(n+" 0 obj\n"+body+"\nendobj\n")};
 add("%PDF-1.4\n%âãÏÓ\n");const N=pgs.length;
 obj(1,"<</Type/Catalog/Pages 2 0 R>>");
 obj(2,"<</Type/Pages/Count "+N+"/Kids ["+pgs.map((_,i)=>(5+i*3)+" 0 R").join(" ")+"]>>");
 pgs.forEach((p,i)=>{const pw=(p.w*.75).toFixed(1),ph=(p.h*.75).toFixed(1),c="q "+pw+" 0 0 "+ph+" 0 0 cm /Im0 Do Q";
  off[3+i*3]=len;add((3+i*3)+" 0 obj\n<</Type/XObject/Subtype/Image/Width "+p.w+"/Height "+p.h+"/ColorSpace/DeviceRGB/BitsPerComponent 8/Filter/DCTDecode/Length "+p.b.length+">>\nstream\n");add(p.b);add("\nendstream\nendobj\n");
  obj(4+i*3,"<</Length "+c.length+">>\nstream\n"+c+"\nendstream");
  obj(5+i*3,"<</Type/Page/Parent 2 0 R/MediaBox [0 0 "+pw+" "+ph+"]/Resources<</XObject<</Im0 "+(3+i*3)+" 0 R>>>>/Contents "+(4+i*3)+" 0 R>>")});
 const M=2+3*N,xr=len;let x="xref\n0 "+(M+1)+"\n0000000000 65535 f \n";
 for(let i=1;i<=M;i++)x+=String(off[i]).padStart(10,"0")+" 00000 n \n";
 add(x+"trailer\n<</Size "+(M+1)+"/Root 1 0 R>>\nstartxref\n"+xr+"\n%%EOF");
 return new Blob(ch,{type:"application/pdf"});
}

function cards(s,n,Q){

  if(i>=D.length){page(`<h2>🃏 انتهت البطاقات</h2><div class="score">${known} / ${D.length}</div><p class="msg">عرفت ${known} بطاقة. أعد البطاقات الصعبة مرة أخرى.</p><button class="btn" id="ag">إعادة</button>`,()=>actHome(s,n));document.getElementById("ag").onclick=()=>cards(s,n,Q);return}
  page(`<h2>🃏 بطاقة ${i+1} / ${D.length}</h2><div class="fc ${fl?"back":""}" id="cd">${esc(fl?D[i][1]:D[i][0])}</div><p class="msg" style="margin:0">${fl?"الإجابة":"اضغط على البطاقة لإظهار الإجابة"}</p>${fl?`<div class="row"><button class="btn alt" id="no">↻ راجعها</button><button class="btn" id="ok">عرفتها ✓</button></div>`:""}`,()=>actHome(s,n));

function drill(s,n,Q){

 const draw=()=>{
  if(i>=D.length){page(`<h2>⚡ النتيجة</h2><div class="score">${sc} / ${D.length}</div><p class="msg">أفضل سلسلة إجابات صحيحة متتالية: ${best}. ${sc>=D.length*.8?"ممتاز! 🌟":"كرّر التدريب لتحسّن نتيجتك 💪"}</p><button class="btn" id="ag">إعادة التدريب</button>`,()=>actHome(s,n));document.getElementById("ag").onclick=()=>drill(s,n,Q);return}
  const m=D[i],o=m.slice(1).map((x,j)=>[x,j===0]).sort(()=>Math.random()-.5);
  page(`<h2>⚡ سؤال ${i+1} / ${D.length}</h2><div class="msg" style="margin:0">الدرجة: ${sc} · السلسلة: ${st}🔥</div><div class="q"><b>${esc(m[0])}</b>${o.map((x,j)=>`<label data-j="${j}">${LET[j]}) ${esc(x[0])}</label>`).join("")}</div><div class="msg" id="fb"></div><button class="btn" id="nx" style="display:none">التالي ←</button>`,()=>actHome(s,n));
  let done=false;
  app.querySelectorAll(".q label").forEach(l=>l.onclick=()=>{if(done)return;done=true;const j=+l.dataset.j,ok=o[j][1];
   app.querySelectorAll(".q label").forEach((e,k)=>{if(o[k][1])e.classList.add("ok")});if(!ok)l.classList.add("bad");
   if(ok){sc++;st++;best=Math.max(best,st)}else st=0;
   document.getElementById("fb").textContent=ok?"✓ إجابة صحيحة!":"✗ الإجابة الصحيحة موضّحة بالأخضر";
   const nx=document.getElementById("nx");nx.style.display="block";nx.onclick=()=>{i++;draw()}});
 };
 draw();
}

function clearLocal(){try{Object.keys(localStorage).filter(k=>k.indexOf("agri_")===0||k.indexOf("pen|")===0).forEach(k=>localStorage.removeItem(k))}catch(e){}}
function cloudPut(k,v){if(!db||!UID)return;PEND[k]=v;clearTimeout(PTM);PTM=setTimeout(flush,700)}
async function flush(){const P=PEND,uid=UID;PEND={};if(!uid)return;
 try{const b=db.batch(),root={};
  for(const k in P){if(k==="agri_plan")root.plan=P[k];else if(k==="agri_sess")root.sess=P[k];
   else if(k.indexOf("pen|")===0)b.set(db.doc("users/"+uid+"/pens/"+k.replace(/[^A-Za-z0-9_-]/g,"_")),{k:k,data:JSON.stringify(P[k]),at:SVT()})}
  if(Object.keys(root).length){root.updatedAt=SVT();b.set(db.doc("users/"+uid),root,{merge:true})}
  await b.commit()}catch(e){toast("تعذر الحفظ السحابي ("+(e.code||"خطأ")+")")}}

async function loadCloud(u,nm){
 let prev=null;try{prev=localStorage.getItem("agri_uid")}catch(e){}
 if(prev&&prev!==u.uid)clearLocal();
 try{localStorage.setItem("agri_uid",u.uid)}catch(e){}
 const fallback=nm||u.displayName||(u.email||"").split("@")[0]||"طالب";
 try{const ref=db.doc("users/"+u.uid);let snap=await ref.get();
  if(!snap.exists){await ref.set({name:fallback,email:u.email||"",plan:[],sess:[],createdAt:SVT()},{merge:true});snap=await ref.get()}
  const d=snap.data()||{};
  if(d.plan)localStorage.setItem("agri_plan",JSON.stringify(d.plan));
  if(d.sess)localStorage.setItem("agri_sess",JSON.stringify(d.sess));
  const ps=await db.collection("users/"+u.uid+"/pens").get();ps.forEach(x=>{const o=x.data();if(o&&o.k)localStorage.setItem(o.k,o.data)});
  const n=d.name||fallback;localStorage.setItem("agri_name",n);return n}
 catch(e){toast("تعذر تحميل بياناتك السحابية ("+(e.code||"خطأ")+"). سيتم استخدام البيانات المحفوظة على الجهاز.");return localStorage.getItem("agri_name")||fallback}
}
